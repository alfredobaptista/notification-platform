spring:
  application:
    name: notification-platform

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: false

  datasource:
    driver-class-name: org.postgresql.Driver


notification:
  providers:

    brevo:
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}

    twilio:
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com/2010-04-01}


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics


server:
  port: ${SERVER_PORT:8080}