spring:
  application:
    name: notification-platform

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: false


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

server:
  port: ${SERVER_PORT:8080}